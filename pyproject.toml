[project]
name = "hft500"
version = "0.1.0"
description = "Next-500ms short-horizon prediction for Binance perps (BTC/ETH/SOL/1000PEPE)"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.20",
    "pyarrow>=17",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
